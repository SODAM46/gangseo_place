<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강서구 리스트</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="diary">
  <div class="wrap">
    <div class="diary-title">
      <h1><span class="script">강서구</span><br><span class="block">리스트</span></h1>
    </div>

    <div class="diary-grid" id="grid"></div>
    <div id="emptyMsg" class="empty" style="display:none;">데이터를 불러오지 못했습니다. app-config.js 설정을 확인해주세요.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app-config.js"></script>
  <script>
    const CATEGORIES = ["카페", "밥&술집"];

    async function loadItems() {
      const { data, error } = await db
        .from("restaurants")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        document.getElementById("grid").innerHTML = "";
        document.getElementById("emptyMsg").style.display = "block";
        console.error(error);
        return;
      }
      render(data || []);
    }

    function naverMapUrl(address) {
      return "https://map.naver.com/p/search/" + encodeURIComponent(address);
    }

    function renderEntry(item) {
      return `
        <div class="diary-entry">
          <div class="diary-line">
            <span class="circle"></span>
            <span class="label">이름</span>
            <span class="val">${escapeHtml(item.name || "")}</span>
          </div>
          <div class="diary-line">
            <span class="circle"></span>
            <span class="label">주소</span>
            ${item.address
              ? `<a class="val link" href="${naverMapUrl(item.address)}" target="_blank" rel="noopener">${escapeHtml(item.address)}</a>`
              : `<span class="val"></span>`}
          </div>
          <div class="diary-line">
            <span class="circle"></span>
            <span class="label">내용</span>
            <span class="val">${escapeHtml(item.note || "")}</span>
          </div>
        </div>
      `;
    }

    function render(items) {
      const grid = document.getElementById("grid");
      grid.innerHTML = CATEGORIES.map(cat => {
        const list = items.filter(i => i.category === cat);
        const body = list.length
          ? list.map(renderEntry).join("")
          : `<div class="diary-empty">아직 등록된 곳이 없어요.</div>`;
        return `
          <div>
            <div class="diary-head">${escapeHtml(cat)} /</div>
            <div class="diary-box">${body}</div>
          </div>
        `;
      }).join("");
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    loadItems();
  </script>
</body>
</html>
